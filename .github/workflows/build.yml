name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Compiler l'APK avec l'image Docker officielle Kivy
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}":/home/user/hostcwd \
            kivy/buildozer \
            android debug

      - name: Publier l'APK comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-delice-apk
          path: bin/*.apk
